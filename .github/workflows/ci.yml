# The gates of every commit (AGENTS.md "Setup", spec 002 AC-R): lint and layer rules, the Worker typecheck and bundle
# check, types, unit and contract tests, the production build and the Playwright smoke.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biome, dependency-cruiser, Worker types and bundles
        run: npm run check
      - name: Route types (writes next-env.d.ts)
        run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke (builds and starts the app)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
