# The gates of every commit (AGENTS.md "Setup", spec 002 AC-R): lint and layer rules, the Worker typecheck and bundle
# check, types, unit and contract tests, then the production build and the Playwright smoke.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biome, dependency-cruiser, Worker types and bundles
        run: npm run check
      - name: Route types (writes next-env.d.ts)
        run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  # The smoke runs in parallel shards, each on its own build. Playwright splits a run by test count, so the dead-click
  # sweep (about 40 % of the time in 74 tests of one file) is sharded on its own and the rest of the smoke apart from
  # it; otherwise its tests would land in one or two shards.
  #
  # Each shard runs in Playwright's image, which holds Chromium and its system libraries: `playwright install
  # --with-deps` waited on apt for 2 to 7 minutes on some runners. The tag follows the locked `@playwright/test`
  # (scripts/ci-workflow.test.ts fails when they differ).
  smoke:
    name: smoke (${{ matrix.suite }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: dead-clicks, filter: --grep, shard: 1/4 }
          - { suite: dead-clicks, filter: --grep, shard: 2/4 }
          - { suite: dead-clicks, filter: --grep, shard: 3/4 }
          - { suite: dead-clicks, filter: --grep, shard: 4/4 }
          - { suite: rest, filter: --grep-invert, shard: 1/8 }
          - { suite: rest, filter: --grep-invert, shard: 2/8 }
          - { suite: rest, filter: --grep-invert, shard: 3/8 }
          - { suite: rest, filter: --grep-invert, shard: 4/8 }
          - { suite: rest, filter: --grep-invert, shard: 5/8 }
          - { suite: rest, filter: --grep-invert, shard: 6/8 }
          - { suite: rest, filter: --grep-invert, shard: 7/8 }
          - { suite: rest, filter: --grep-invert, shard: 8/8 }
    env:
      DATA_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Playwright smoke
        run: npx playwright test ${{ matrix.filter }} 'dead-clicks\.spec' --shard=${{ matrix.shard }}
        env:
          E2E_PREBUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 7
